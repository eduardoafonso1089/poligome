name: Editor Refactor

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-ai:
    name: SAM installers and BYOM HTTP contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reference container dependencies
        run: pip install numpy==2.2.6 opencv-python-headless==4.11.0.86 pillow==11.3.0
      - name: Check SAM installers
        run: bash tests/sam-installers.test.sh
      - name: Check BYOM CLI and real HTTP handler
        run: bash tests/byom.test.sh

  native-ai:
    name: Native Windows SAM launch and device checks
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install current Hugging Face CLI
        run: pip install huggingface_hub==2.1.1
      - name: Check real Python argv, HF entry point and health probe
        shell: powershell
        run: ./tests/sam-native-installer.test.ps1

  # Tier 1: everything that needs no build and no browser. Fails fast so a typo
  # or a broken unit never costs a full build.
  static:
    name: Types, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The architecture rules are errors; the react-hooks findings inherited from
      # the pre-refactor editor are warnings under a ratchet. 60 is the count on
      # main today, so a new warning fails the build and the number only goes down.
      - name: Lint, including the architecture boundaries
        run: npx eslint . --ignore-pattern dist --ignore-pattern .next --max-warnings 60

      - name: Unit, model and component tests
        run: npm run test:unit

      - name: Coverage report
        if: always()
        run: npm run test:coverage 2>&1 | tail -40

  # Tier 2: the built artifact and the export contracts.
  build:
    name: Build and export contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch main parity reference
        run: git fetch origin main:refs/remotes/origin/main

      - name: Build verified app
        run: npm run build

      - name: Build Cloudflare Pages artifact
        run: npm run build:pages

      - name: Tests against the built artifact
        run: npm run test:unit

      - name: Check editor i18n parity debt
        run: node scripts/check-editor-i18n-parity.mjs

      - name: Check cross-branch export goldens
        run: node --import tsx scripts/check-export-parity.mjs

      - name: Report COG tile benchmark
        run: COG_BENCH_ITERATIONS=5000 npm run benchmark:cog
