name: Editor Interaction Audit

on:
  pull_request:

permissions:
  contents: read

jobs:
  interaction-audit:
    if: github.head_ref == 'fix/editor-interactions-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install app
        run: npm ci

      - name: Build static editor
        run: npm run build:pages

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve editor
        run: |
          nohup python3 -m http.server 4174 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE/out" >/tmp/poligome-audit-server.log 2>&1 &
          for i in {1..40}; do curl -LfsS http://127.0.0.1:4174/annotate/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/poligome-audit-server.log
          exit 1

      - name: Audit desktop and mobile interactions
        run: |
          cat > /tmp/editor-interaction-audit.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';

          const BASE = 'http://127.0.0.1:4174';
          const report = [];
          const errors = [];
          await fs.mkdir('interaction-audit', { recursive: true });

          function record(scope, name, ok, detail = '') {
            report.push({ scope, name, ok, detail });
            console.log(`${ok ? 'PASS' : 'FAIL'} [${scope}] ${name}${detail ? ` — ${detail}` : ''}`);
            if (!ok) errors.push(`[${scope}] ${name}: ${detail}`);
          }

          async function check(scope, name, fn) {
            try {
              const detail = await fn();
              record(scope, name, true, typeof detail === 'string' ? detail : '');
            } catch (error) {
              record(scope, name, false, error instanceof Error ? error.message : String(error));
            }
          }

          async function loadDemo(page) {
            await page.goto(`${BASE}/annotate/?demo=1`, { waitUntil: 'networkidle', timeout: 90000 });
            await page.waitForFunction(() => document.querySelectorAll('[data-annotation-id]').length >= 1, null, { timeout: 30000 });
            const card = page.locator('.pre-refactor-demo-card');
            if (await card.count()) {
              const box = page.getByRole('button', { name: /Caixa \(B\)|Box \(B\)/ }).first();
              await box.click();
              await card.waitFor({ state: 'detached', timeout: 5000 }).catch(() => card.waitFor({ state: 'hidden', timeout: 5000 }));
            }
          }

          async function canvasBox(page) {
            const svg = page.locator('.stage svg').first();
            await svg.waitFor({ state: 'visible' });
            const box = await svg.boundingBox();
            if (!box) throw new Error('canvas SVG has no bounding box');
            return { svg, box };
          }

          async function tool(page, pattern) {
            const button = page.getByRole('button', { name: pattern }).first();
            await button.waitFor({ state: 'visible' });
            if (await button.isDisabled()) throw new Error(`tool disabled: ${await button.getAttribute('aria-label')}`);
            await button.click();
            return button;
          }

          async function countAnnotations(page) {
            return page.locator('[data-annotation-id]').count();
          }

          async function desktopAudit(browser) {
            const context = await browser.newContext({ viewport: { width: 1440, height: 900 } });
            const page = await context.newPage();
            const pageErrors = [];
            page.on('pageerror', (error) => pageErrors.push(error.message));

            await check('desktop', 'Demo route loads 3-image project', async () => {
              await loadDemo(page);
              const text = await page.locator('.status > div span').innerText();
              if (!/1\s*\/\s*3/.test(text)) throw new Error(`unexpected image status: ${text}`);
              return text;
            });

            await check('desktop', 'Box drawing', async () => {
              await tool(page, /Caixa \(B\)|Box \(B\)/);
              const before = await countAnnotations(page);
              const { box } = await canvasBox(page);
              await page.mouse.move(box.x + box.width * .62, box.y + box.height * .55);
              await page.mouse.down();
              await page.mouse.move(box.x + box.width * .72, box.y + box.height * .68, { steps: 5 });
              await page.mouse.up();
              const after = await countAnnotations(page);
              if (after !== before + 1) throw new Error(`annotation count ${before} -> ${after}`);
              return `${before} -> ${after}`;
            });

            await check('desktop', 'Polygon finishes with Enter', async () => {
              await tool(page, /Polígono por pontos \(P\)|Polygon/);
              const before = await countAnnotations(page);
              const { box } = await canvasBox(page);
              for (const [x,y] of [[.55,.22],[.66,.23],[.67,.34],[.56,.35]]) await page.mouse.click(box.x + box.width*x, box.y + box.height*y);
              const finish = page.getByRole('button', { name: /^Concluir$|^Finish$/ }).first();
              if (await finish.isDisabled()) throw new Error('Finish should be enabled after 4 polygon points');
              await page.keyboard.press('Enter');
              const after = await countAnnotations(page);
              if (after !== before + 1) throw new Error(`annotation count ${before} -> ${after}`);
            });

            await check('desktop', 'Line finishes with explicit Finish', async () => {
              await tool(page, /Linha \/ polilinha \(L\)|Line/);
              const before = await countAnnotations(page);
              const { box } = await canvasBox(page);
              await page.mouse.click(box.x + box.width*.18, box.y + box.height*.78);
              await page.mouse.click(box.x + box.width*.28, box.y + box.height*.72);
              await page.mouse.click(box.x + box.width*.38, box.y + box.height*.76);
              const finish = page.getByRole('button', { name: /^Concluir$|^Finish$/ }).first();
              if (await finish.isDisabled()) throw new Error('Finish should be enabled for line');
              await finish.click();
              const after = await countAnnotations(page);
              if (after !== before + 1) throw new Error(`annotation count ${before} -> ${after}`);
            });

            await check('desktop', 'Remove last point and Cancel draft', async () => {
              await tool(page, /Polígono por pontos \(P\)|Polygon/);
              const { box } = await canvasBox(page);
              await page.mouse.click(box.x + box.width*.15, box.y + box.height*.15);
              await page.mouse.click(box.x + box.width*.22, box.y + box.height*.15);
              await page.mouse.click(box.x + box.width*.22, box.y + box.height*.24);
              const remove = page.getByRole('button', { name: /remover.*ponto|último ponto|last point/i }).first();
              await remove.click();
              const finish = page.getByRole('button', { name: /^Concluir$|^Finish$/ }).first();
              if (!await finish.isDisabled()) throw new Error('Finish remained enabled after dropping below 3 polygon points');
              const cancel = page.getByRole('button', { name: /^Cancelar$|^Cancel$/ }).first();
              await cancel.click();
              if (await page.locator('.drawing-draft').count()) throw new Error('draft still visible after cancel');
            });

            await check('desktop', 'Freehand drawing', async () => {
              await tool(page, /Polígono à mão livre \(F\)|Freehand/);
              const before = await countAnnotations(page);
              const { box } = await canvasBox(page);
              await page.mouse.move(box.x + box.width*.72, box.y + box.height*.72);
              await page.mouse.down();
              for (const [x,y] of [[.78,.72],[.80,.78],[.74,.82],[.68,.77],[.72,.72]]) await page.mouse.move(box.x+box.width*x, box.y+box.height*y, {steps:2});
              await page.mouse.up();
              const after = await countAnnotations(page);
              if (after !== before + 1) throw new Error(`annotation count ${before} -> ${after}`);
            });

            await check('desktop', 'Point tool', async () => {
              await tool(page, /Ponto-chave \(K\)|Point/);
              const before = await countAnnotations(page);
              const { box } = await canvasBox(page);
              await page.mouse.click(box.x + box.width*.82, box.y + box.height*.58);
              const after = await countAnnotations(page);
              if (after !== before + 1) throw new Error(`annotation count ${before} -> ${after}`);
            });

            await check('desktop', 'Undo and Redo', async () => {
              const before = await countAnnotations(page);
              const undo = page.getByRole('button', { name: /^Desfazer$|^Undo$/ }).first();
              await undo.click();
              const undone = await countAnnotations(page);
              if (undone !== before - 1) throw new Error(`undo count ${before} -> ${undone}`);
              const redo = page.getByRole('button', { name: /^Refazer$|^Redo$/ }).first();
              await redo.click();
              const redone = await countAnnotations(page);
              if (redone !== before) throw new Error(`redo count ${undone} -> ${redone}`);
            });

            await check('desktop', 'Additive multi-selection toggles two objects', async () => {
              await tool(page, /Selecionar e mover \(V\)|Select/);
              const multi = page.getByRole('button', { name: /Selecionar várias|Select multiple/i }).first();
              await multi.click();
              if (await multi.getAttribute('aria-pressed') !== 'true') throw new Error('multi-select mode did not activate');
              const a1 = page.locator('[data-annotation-id="demo-a1"]');
              const a2 = page.locator('[data-annotation-id="demo-a2"]');
              await a1.click({ force: true });
              await a2.click({ force: true });
              const selected = page.locator('[data-annotation-id] rect, [data-annotation-id] path, [data-annotation-id] polygon');
              if (await page.getByRole('button', { name: /Excluir$/ }).first().isDisabled()) throw new Error('delete selected remains disabled');
              return `multi-select active; ${await selected.count()} rendered shape nodes`;
            });

            await check('desktop', 'Snap toggle', async () => {
              const snap = page.getByRole('button', { name: /Encaixe|Snap/i }).first();
              const before = await snap.getAttribute('aria-pressed');
              await snap.click();
              const after = await snap.getAttribute('aria-pressed');
              if (before === after) throw new Error(`aria-pressed remained ${after}`);
              await snap.click();
            });

            await check('desktop', 'Coordinate guide renders', async () => {
              const guide = page.getByRole('button', { name: /Guias de coordenadas/i }).first();
              await guide.click();
              const { box } = await canvasBox(page);
              await page.mouse.move(box.x + box.width*.45, box.y + box.height*.45);
              await page.waitForTimeout(100);
              if (!await page.locator('.coordinate-guide').count()) throw new Error('coordinate guide not rendered');
              await guide.click();
            });

            await check('desktop', 'Mouse Pan changes scroll position', async () => {
              for (let i=0;i<4;i++) await page.getByRole('button', { name: /Aumentar zoom|Zoom in/i }).first().click();
              await tool(page, /Mover canvas \(H\)|Pan/);
              const scroll = page.locator('.stage > section').first();
              await scroll.evaluate((el) => { el.scrollLeft = 120; el.scrollTop = 80; });
              const before = await scroll.evaluate((el) => [el.scrollLeft, el.scrollTop]);
              const { box } = await canvasBox(page);
              await page.mouse.move(box.x + box.width*.5, box.y + box.height*.5);
              await page.mouse.down();
              await page.mouse.move(box.x + box.width*.4, box.y + box.height*.4, { steps: 5 });
              await page.mouse.up();
              const after = await scroll.evaluate((el) => [el.scrollLeft, el.scrollTop]);
              if (before[0] === after[0] && before[1] === after[1]) throw new Error(`scroll unchanged: ${before}`);
              return `${before} -> ${after}`;
            });

            await check('desktop', 'Fit returns zoom to 92%', async () => {
              await page.getByRole('button', { name: /Centralizar e ajustar|Fit/i }).first().click();
              const zoomText = await page.locator('.zoom span').innerText();
              if (!/92%/.test(zoomText)) throw new Error(`zoom is ${zoomText}`);
            });

            await check('desktop', 'SAM toolbar opens setup modal', async () => {
              await tool(page, /Segmentar com SAM \(S\)|SAM/);
              const dialog = page.getByRole('dialog', { name: /SAM local|SAM/i }).first();
              await dialog.waitFor({ state: 'visible', timeout: 5000 });
              await dialog.getByRole('button', { name: /Fechar|Close/i }).first().click();
            });

            await check('desktop', 'Advanced polygon tools are actionable', async () => {
              await tool(page, /Selecionar e mover \(V\)|Select/);
              await page.locator('[data-annotation-id="demo-a1"]').click({ force: true });
              const names = [/Simplificar polígono|Simplify/i, /Duplicar polígono|Duplicate/i, /Adicionar buraco|hole/i, /Cortar polígono|Split/i, /Rotacionar e redimensionar|Transform/i, /Remodelar borda|Reshape/i];
              for (const name of names) {
                const button = page.getByRole('button', { name }).first();
                if (!await button.count()) throw new Error(`missing tool ${name}`);
                if (await button.isDisabled()) throw new Error(`disabled tool ${await button.getAttribute('aria-label')}`);
              }
            });

            await check('desktop', 'Duplicate polygon changes count', async () => {
              const before = await countAnnotations(page);
              await page.getByRole('button', { name: /Duplicar polígono|Duplicate/i }).first().click();
              const after = await countAnnotations(page);
              if (after !== before + 1) throw new Error(`annotation count ${before} -> ${after}`);
            });

            await page.screenshot({ path: 'interaction-audit/desktop.png', fullPage: false });
            if (pageErrors.length) record('desktop', 'No page errors', false, pageErrors.join(' | '));
            else record('desktop', 'No page errors', true);
            await context.close();
          }

          async function mobileAudit(browser) {
            const context = await browser.newContext({ viewport: { width: 390, height: 844 }, hasTouch: true, isMobile: true });
            const page = await context.newPage();
            const pageErrors = [];
            page.on('pageerror', (error) => pageErrors.push(error.message));

            await check('mobile', 'Demo route loads and guide can be dismissed by Box tool', async () => {
              await loadDemo(page);
              if (await page.locator('.pre-refactor-demo-card').count()) throw new Error('demo guide still blocking after selecting Box');
              const status = await page.locator('.status > div span').innerText();
              if (!/1\s*\/\s*3/.test(status)) throw new Error(`unexpected image status: ${status}`);
            });

            await check('mobile', 'Polygon has visible Finish control and completes', async () => {
              await tool(page, /Polígono por pontos \(P\)|Polygon/);
              const before = await countAnnotations(page);
              const { box } = await canvasBox(page);
              for (const [x,y] of [[.56,.56],[.70,.56],[.70,.70],[.56,.70]]) await page.touchscreen.tap(box.x + box.width*x, box.y + box.height*y);
              const finish = page.getByRole('button', { name: /^Concluir$|^Finish$/ }).first();
              await finish.waitFor({ state: 'visible' });
              if (await finish.isDisabled()) throw new Error('Finish disabled after four touch points');
              await finish.tap();
              const after = await countAnnotations(page);
              if (after !== before + 1) throw new Error(`annotation count ${before} -> ${after}`);
            });

            await check('mobile', 'Line completes with Finish control', async () => {
              await tool(page, /Linha \/ polilinha \(L\)|Line/);
              const before = await countAnnotations(page);
              const { box } = await canvasBox(page);
              for (const [x,y] of [[.18,.70],[.30,.66],[.40,.72]]) await page.touchscreen.tap(box.x + box.width*x, box.y + box.height*y);
              const finish = page.getByRole('button', { name: /^Concluir$|^Finish$/ }).first();
              if (await finish.isDisabled()) throw new Error('Finish disabled for touch line');
              await finish.tap();
              const after = await countAnnotations(page);
              if (after !== before + 1) throw new Error(`annotation count ${before} -> ${after}`);
            });

            await check('mobile', 'Remove last point and Cancel are usable', async () => {
              await tool(page, /Polígono por pontos \(P\)|Polygon/);
              const { box } = await canvasBox(page);
              await page.touchscreen.tap(box.x + box.width*.20, box.y + box.height*.20);
              await page.touchscreen.tap(box.x + box.width*.30, box.y + box.height*.20);
              await page.touchscreen.tap(box.x + box.width*.30, box.y + box.height*.30);
              const remove = page.getByRole('button', { name: /remover.*ponto|último ponto|last point/i }).first();
              await remove.tap();
              const finish = page.getByRole('button', { name: /^Concluir$|^Finish$/ }).first();
              if (!await finish.isDisabled()) throw new Error('Finish remained enabled after point removal');
              await page.getByRole('button', { name: /^Cancelar$|^Cancel$/ }).first().tap();
              if (await page.locator('.drawing-draft').count()) throw new Error('draft still visible');
            });

            await check('mobile', 'Additive multi-selection toggles objects', async () => {
              await tool(page, /Selecionar e mover \(V\)|Select/);
              const multi = page.getByRole('button', { name: /Selecionar várias|Select multiple/i }).first();
              await multi.tap();
              if (await multi.getAttribute('aria-pressed') !== 'true') throw new Error('multi-select did not activate');
              await page.locator('[data-annotation-id="demo-a1"]').tap({ force: true });
              await page.locator('[data-annotation-id="demo-a2"]').tap({ force: true });
              const deleteSelected = page.getByRole('button', { name: /^Excluir$|^Delete$/ }).last();
              if (await deleteSelected.isDisabled()) throw new Error('delete remains disabled after multi-selection');
            });

            await check('mobile', 'Touch Pan button is present and toggles Pan', async () => {
              const panAction = page.locator('.drawing-actions').getByRole('button', { name: /Mover canvas|Pan/i }).first();
              await panAction.waitFor({ state: 'visible' });
              await panAction.tap();
              const toolbarPan = page.getByRole('button', { name: /Mover canvas \(H\)|Pan/ }).first();
              if (await toolbarPan.getAttribute('aria-pressed') !== 'true') throw new Error('Pan tool did not become active');
              await panAction.tap();
            });

            await check('mobile', 'SAM toolbar opens modal', async () => {
              await tool(page, /Segmentar com SAM \(S\)|SAM/);
              const dialog = page.getByRole('dialog', { name: /SAM local|SAM/i }).first();
              await dialog.waitFor({ state: 'visible', timeout: 5000 });
              await dialog.getByRole('button', { name: /Fechar|Close/i }).first().tap();
            });

            await page.screenshot({ path: 'interaction-audit/mobile.png', fullPage: false });
            if (pageErrors.length) record('mobile', 'No page errors', false, pageErrors.join(' | '));
            else record('mobile', 'No page errors', true);
            await context.close();
          }

          const browser = await chromium.launch({ headless: true });
          try {
            await desktopAudit(browser);
            await mobileAudit(browser);
          } finally {
            await browser.close();
          }

          await fs.writeFile('interaction-audit/report.json', JSON.stringify(report, null, 2));
          const passed = report.filter((item) => item.ok).length;
          console.log(`\n${passed}/${report.length} interaction checks passed.`);
          if (errors.length) {
            console.error('\nInteraction audit failures:\n' + errors.map((item) => `- ${item}`).join('\n'));
            process.exit(1);
          }
          EOF
          node /tmp/editor-interaction-audit.mjs

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-interaction-audit
          path: interaction-audit/
          retention-days: 2
